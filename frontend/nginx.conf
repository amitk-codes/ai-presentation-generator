server {
  listen 80;
  server_name _;

  # Static frontend
  root /usr/share/nginx/html;
  index index.html;

  # Serve ES module workers (pdf.js) with a JS MIME type, not octet-stream,
  # or the browser refuses to load the module worker.
  location ~* \.mjs$ {
    default_type application/javascript;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy the n8n webhook so the browser stays same-origin (no CORS).
  location /webhook/ {
    proxy_pass http://n8n:5678/webhook/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Generation can take a while — don't cut it off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Reverse-proxy generated files so the PDF preview, pdf.js thumbnails, and
  # downloads are same-origin (pdf.js reads bytes, which needs CORS otherwise).
  location /files/ {
    proxy_pass http://render-service:4000/files/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
}
