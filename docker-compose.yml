# Presentation Automation — service stack
#
# Commit 1 (scaffold): only n8n runs here. The render-service, mcp-server, and
# frontend services are added to this file at their own milestones, so the
# compose file grows commit-by-commit alongside the code.

services:
  # n8n — the orchestration "brain". The full slide-generation workflow lives
  # here as visible nodes: webhook -> Gemini -> validate -> render -> respond.
  n8n:
    image: n8nio/n8n:latest # pin to the exact version after first `docker compose up` (see README)
    container_name: pa-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false # allow plain-http access over localhost
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Webhook base URL so the frontend + MCP server can reach triggers by name
      - WEBHOOK_URL=http://localhost:5678/
      # Let workflow expressions read env vars (the Gemini key/model below)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
    volumes:
      - n8n_data:/home/node/.n8n # persists workflows + credentials across restarts

  # render-service — turns deck JSON into downloadable files (PDF + PPTX).
  # This is the one job n8n can't do itself: it needs a headless browser
  # (Playwright) for PDF and pptxgenjs for an editable PowerPoint.
  render-service:
    build: ./render-service
    container_name: pa-render
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      # Base URL embedded in returned download links. Override with your tunnel
      # URL for remote (ChatGPT/Claude) demos.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:4000}
      - OUTPUT_DIR=/app/output
      - PEXELS_API_KEY=${PEXELS_API_KEY:-} # optional; slide photos when set
    volumes:
      - ./output:/app/output # generated decks land here (git-ignored)

  # mcp-server — exposes a `generate_presentation` MCP tool over Streamable HTTP
  # so ChatGPT/Claude can generate decks. It calls the SAME n8n webhook; it holds
  # no generation logic of its own.
  mcp-server:
    build: ./mcp-server
    container_name: pa-mcp
    ports:
      - "8787:8787" # 7000 avoided — macOS AirPlay Receiver binds it
    environment:
      - PORT=8787
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/generate
    depends_on:
      - n8n

  # frontend — a simple web form. nginx serves the static page AND reverse-proxies
  # /webhook/* to n8n, so the browser stays same-origin (no CORS needed).
  frontend:
    build: ./frontend # multi-stage: Vite build (React + TS) → nginx serves the bundle
    container_name: pa-frontend
    ports:
      - "8080:80"
    depends_on:
      - n8n
      - render-service

volumes:
  n8n_data:
